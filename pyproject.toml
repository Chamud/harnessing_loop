[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "harnessing_loop"
version = "0.1.0"
description = "The core of an agent: VLM, loop, tools, sandbox, gates. Build agentic applications on top of it."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Chamud Geesara Pathirana" }]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
bedrock = ["anthropic[bedrock]>=0.40", "boto3>=1.34"]
dev = ["pytest>=8.0"]

[project.scripts]
hloop = "harnessing_loop.cli:main"

[tool.setuptools.packages.find]
include = ["harnessing_loop*"]

[tool.setuptools.package-data]
harnessing_loop = ["profiles/*.yaml", "skills/bundled/**/SKILL.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
