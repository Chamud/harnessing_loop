name: fizzbuzz
profile: coder
prompt: "Write fizzbuzz.py that prints FizzBuzz for 1..15, run it, and finish."
checks:
  - completed
  - file_exists: fizzbuzz.py
  - file_contains: {path: fizzbuzz.py, text: "FizzBuzz"}
max_cost_usd: 1.0
script:
  - {tool: todo_write, input: {todos: [{content: "write and run", status: in_progress}]}}
  - {tool: write_file, input: {path: fizzbuzz.py, content: "for i in range(1, 16):\n    print('FizzBuzz' if i % 15 == 0 else 'Fizz' if i % 3 == 0 else 'Buzz' if i % 5 == 0 else i)\n"}}
  - {tool: shell, input: {command: "python fizzbuzz.py"}}
  - - {tool: todo_write, input: {todos: [{content: "write and run", status: completed}]}}
    - {tool: finish, input: {summary: "fizzbuzz.py written and run"}}
